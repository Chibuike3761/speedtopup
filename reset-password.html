<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset Password - Speed Topup Data</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"/>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('speedtopup_theme') || 'light');</script>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <div class="logo">Speed Topup <span style="color:#00d4aa">Data</span></div>
    <div class="nav-links">
      <button id="lang-toggle-btn" class="lang-toggle-switch" onclick="speedtopupToggleLanguage()" role="switch" aria-checked="false" aria-label="Switch to Pidgin"><span class="lang-toggle-option lang-toggle-option-en">EN</span><span class="lang-toggle-option lang-toggle-option-pcm">PCM</span><span class="lang-toggle-knob"></span></button>
      <button id="theme-toggle-btn" class="theme-toggle-btn" onclick="speedtopupToggleTheme()">🌙</button>
    </div>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card">
    <h2 data-i18n="reset.title">Reset Password</h2>

    <div id="reset-form">
      <p style="color:var(--gray); font-size:0.9rem; margin-bottom:1rem;" data-i18n="reset.sub">Choose a new password for your account.</p>

      <div class="input-wrap">
        <input type="password" id="reset-password" placeholder="New Password" data-i18n-placeholder="reset.newPasswordPlaceholder" class="modal-input">
        <i id="reset-password-toggle" onclick="togglePassword('reset-password')" class="fas fa-eye toggle-eye"></i>
      </div>
      <div class="input-wrap">
        <input type="password" id="reset-password-confirm" placeholder="Confirm New Password" data-i18n-placeholder="reset.confirmPasswordPlaceholder" class="modal-input">
        <i id="reset-password-confirm-toggle" onclick="togglePassword('reset-password-confirm')" class="fas fa-eye toggle-eye"></i>
      </div>

      <button id="reset-submit-btn" onclick="submitResetPassword(this)" class="btn btn-primary btn-block" style="margin-top:10px;" data-i18n="reset.submit">Reset Password</button>
    </div>

    <div id="reset-success" style="display:none; text-align:center;">
      <p style="font-size:2rem; margin-bottom:0.5rem;">✅</p>
      <p data-i18n="reset.successMsg">Your password has been reset. You can now log in.</p>
      <a href="login.html" class="btn btn-primary btn-block" style="margin-top:1rem;" data-i18n="reset.goToLogin">Go to Login</a>
    </div>

    <div id="reset-invalid" style="display:none; text-align:center;">
      <p style="font-size:2rem; margin-bottom:0.5rem;">⚠️</p>
      <p data-i18n="reset.invalidMsg">This reset link is missing or invalid.</p>
      <a href="forgot-password.html" class="btn btn-primary btn-block" style="margin-top:1rem;" data-i18n="reset.requestNew">Request a New Link</a>
    </div>

    <a href="index.html" class="back-link">&larr; <span data-i18n="back.home">Back to Homepage</span></a>
  </div>
</div>

<script src="js/map.js"></script>
<script src="js/i18n.js"></script>
<script src="js/theme.js"></script>
<script src="js/support-widget.js"></script>
<script>
const resetToken = new URLSearchParams(window.location.search).get('token');
if (!resetToken) {
  document.getElementById('reset-form').style.display = 'none';
  document.getElementById('reset-invalid').style.display = 'block';
}

async function submitResetPassword(btn) {
  const password = document.getElementById('reset-password').value;
  const confirmPassword = document.getElementById('reset-password-confirm').value;

  if (!password || !confirmPassword) return alert('Please fill in both password fields');
  if (password.length < 6) return alert('Password must be at least 6 characters');
  if (password !== confirmPassword) return alert('Passwords do not match');

  const original = btn.textContent;
  btn.textContent = 'Resetting...';
  btn.disabled = true;

  try {
    const res = await fetch(`${API_BASE}/auth/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: resetToken, password })
    });
    const data = await res.json();

    if (res.ok) {
      document.getElementById('reset-form').style.display = 'none';
      document.getElementById('reset-success').style.display = 'block';
    } else {
      alert(data.error || 'Could not reset password. The link may have expired.');
    }
  } catch (err) {
    alert('Could not reach the server. Is the backend running?');
  } finally {
    btn.textContent = original;
    btn.disabled = false;
  }
}
</script>
</body>
</html>
