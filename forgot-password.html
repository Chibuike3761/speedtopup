<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Forgot Password - Speed Topup Data</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"/>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('speedtopup_theme') || 'light');</script>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <div class="logo">Speed Topup <span style="color:#00d4aa">Data</span></div>
    <div class="nav-links">
      <button id="lang-toggle-btn" class="lang-toggle-switch" onclick="speedtopupToggleLanguage()" role="switch" aria-checked="false" aria-label="Switch to Pidgin"><span class="lang-toggle-option lang-toggle-option-en">EN</span><span class="lang-toggle-option lang-toggle-option-pcm">PCM</span><span class="lang-toggle-knob"></span></button>
      <button id="theme-toggle-btn" class="theme-toggle-btn" onclick="speedtopupToggleTheme()">🌙</button>
    </div>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card">
    <h2 data-i18n="forgot.title">Forgot Password</h2>
    <p style="color:var(--gray); font-size:0.9rem; margin-bottom:1rem;" data-i18n="forgot.sub">Enter the email on your account and we'll send you a link to reset your password.</p>

    <div id="forgot-form">
      <input type="email" id="forgot-email" placeholder="Email Address" data-i18n-placeholder="auth.emailPlaceholder" class="modal-input">
      <button id="forgot-submit-btn" onclick="submitForgotPassword(this)" class="btn btn-primary btn-block" style="margin-top:10px;" data-i18n="forgot.submit">Send Reset Link</button>
    </div>

    <div id="forgot-success" style="display:none; text-align:center;">
      <p style="font-size:2rem; margin-bottom:0.5rem;">📧</p>
      <p data-i18n="forgot.successMsg">If an account exists for that email, a password reset link has been sent. Check your inbox (and spam folder).</p>
    </div>

    <p class="switch-link"><a href="login.html" data-i18n="forgot.backToLogin">Back to Login</a></p>
    <a href="index.html" class="back-link">&larr; <span data-i18n="back.home">Back to Homepage</span></a>
  </div>
</div>

<script src="js/map.js"></script>
<script src="js/i18n.js"></script>
<script src="js/theme.js"></script>
<script src="js/support-widget.js"></script>
<script>
async function submitForgotPassword(btn) {
  const email = document.getElementById('forgot-email').value.trim();
  if (!email) return alert('Please enter your email address');

  const original = btn.textContent;
  btn.textContent = 'Sending...';
  btn.disabled = true;

  try {
    const res = await fetch(`${API_BASE}/auth/forgot-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();

    // Always show the success state, even on a non-2xx response, EXCEPT for
    // rate-limiting - that's the one case worth surfacing distinctly so a
    // genuine user knows to wait rather than assuming an email is on its way.
    if (res.status === 429) {
      alert(data.error || 'Too many requests. Please wait a few minutes and try again.');
    } else {
      document.getElementById('forgot-form').style.display = 'none';
      document.getElementById('forgot-success').style.display = 'block';
    }
  } catch (err) {
    alert('Could not reach the server. Is the backend running?');
  } finally {
    btn.textContent = original;
    btn.disabled = false;
  }
}
</script>
</body>
</html>
